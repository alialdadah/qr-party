# Render Blueprint — one click deploys the web service AND a free Postgres DB.
# After connecting in the dashboard you only need to set HMAC_SECRET and STAFF_PIN.
services:
  - type: web
    name: qr-party
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HMAC_SECRET
        sync: false        # set manually in the dashboard (same value as your local .env)
      - key: STAFF_PIN
        sync: false        # set manually (e.g. 4729) — door staff scan-only
      - key: ADMIN_PIN
        sync: false        # set manually — a different PIN with add/edit/delete access
      - key: DATABASE_URL
        fromDatabase:
          name: qr-party-db
          property: connectionString

databases:
  - name: qr-party-db
    plan: free
    databaseName: qrparty
    user: qrparty
