<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Party Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin: 0; padding: 16px;
    background: #0a0a0a; color: #fff;
    min-height: 100vh;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 20px; }
  input, button {
    font-size: 16px; padding: 14px; width: 100%;
    border-radius: 10px; border: none; margin-bottom: 10px;
    font-family: inherit;
  }
  input { background: #1f1f1f; color: #fff; border: 1px solid #333; }
  input:focus { outline: none; border-color: #6366f1; }
  button { background: #6366f1; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #4f46e5; }
  button.secondary { background: #262626; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  #reader video { border-radius: 12px; }
  .result {
    padding: 24px; border-radius: 14px; text-align: center;
    margin-top: 16px; font-size: 16px; animation: pop 0.2s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .ok { background: #16a34a; }
  .duplicate { background: #ca8a04; }
  .invalid { background: #dc2626; }
  .confirm { background: #2563eb; }
  .icon { font-size: 40px; margin-bottom: 8px; }
  .name { font-size: 26px; font-weight: 700; margin: 8px 0; }
  .table { font-size: 18px; font-weight: 600; margin: 6px 0; opacity: 0.95; }
  .reason { font-size: 14px; opacity: 0.9; margin-top: 4px; }
  .stats {
    font-size: 13px; opacity: 0.6; text-align: center;
    margin: 16px 0; padding: 8px; background: #1a1a1a; border-radius: 8px;
  }
  .gate { padding-top: 60px; }
  .hint { font-size: 12px; opacity: 0.5; margin-top: -6px; margin-bottom: 12px; }
  .stepper {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin: 16px 0;
  }
  .stepper button {
    width: 56px; height: 56px; padding: 0; margin: 0;
    font-size: 28px; font-weight: 700; border-radius: 50%;
    background: rgba(255,255,255,0.18);
  }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper .count {
    font-size: 36px; font-weight: 800; min-width: 60px;
  }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button { margin: 0; }
  .admit-btn { background: #fff; color: #1e40af; }
  .admit-btn:hover { background: #f3f4f6; }
  .meta { font-size: 13px; opacity: 0.85; margin-top: 6px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button {
    flex: 1; padding: 10px; margin: 0; font-size: 14px; font-weight: 600;
    background: #1f1f1f; color: #ccc; border-radius: 10px;
  }
  .tabs button.active { background: #6366f1; color: #fff; }
  .chips { display: flex; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
  .chips button {
    width: auto; padding: 6px 12px; margin: 0; font-size: 13px; font-weight: 600;
    background: #1f1f1f; color: #aaa; border-radius: 999px;
  }
  .chips button.active { background: #6366f1; color: #fff; }
  .list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .row {
    background: #1a1a1a; padding: 12px 14px; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; border: 1px solid #262626;
  }
  .row:hover { background: #222; }
  .row .left { flex: 1; min-width: 0; }
  .row .name-row { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; opacity: 0.6; margin-top: 2px; }
  .row .badge {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    margin-left: 8px; flex-shrink: 0;
  }
  .badge.none { background: #262626; color: #888; }
  .badge.partial { background: #ca8a04; color: #fff; }
  .badge.complete { background: #16a34a; color: #fff; }
  .empty { text-align: center; opacity: 0.5; padding: 40px 0; font-size: 14px; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #161616; width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 20px; }
  .modal label { font-size: 12px; opacity: 0.7; display: block; margin-bottom: 4px; margin-top: 8px; }
  .modal .danger { background: #7f1d1d; }
  .modal .danger:hover { background: #991b1b; }
  .qr-img { width: 100%; max-width: 280px; display: block; margin: 12px auto; background: #fff; padding: 10px; border-radius: 8px; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .row-actions button { flex: 1; min-width: 100px; }
</style>
</head>
<body>

<div id="gate" class="container gate">
  <h1>Sign in</h1>
  <input id="apiUrl" placeholder="API URL (https://...)">
  <div class="hint">Your deployed backend URL, no trailing slash</div>
  <input id="pin" type="password" placeholder="Staff or admin PIN" inputmode="numeric">
  <input id="name" placeholder="Your name (for the log)">
  <button onclick="enter()">Continue</button>
</div>

<div id="app" class="container" style="display:none;">
  <div id="tabs" class="tabs">
    <button id="tab-scan" class="active" onclick="switchTab('scan')">Scan</button>
    <button id="tab-guests" class="admin-only" onclick="switchTab('guests')" style="display:none;">Guests</button>
    <button id="tab-add" class="admin-only" onclick="switchTab('add')" style="display:none;">Add</button>
    <button id="tab-log" class="admin-only" onclick="switchTab('log')" style="display:none;">Log</button>
  </div>

  <div id="pane-scan">
    <div id="reader"></div>
    <div id="result"></div>
    <div id="stats" class="stats">Loading...</div>
  </div>

  <div id="pane-guests" style="display:none;">
    <input id="search" placeholder="Search by name..." oninput="renderGuests()">
    <div id="filterChips" class="chips">
      <button class="active" data-filter="all">All</button>
      <button data-filter="none">Remaining</button>
      <button data-filter="partial">Partial</button>
      <button data-filter="complete">Done</button>
    </div>
    <div id="guestList" class="list"></div>
  </div>

  <div id="pane-log" style="display:none;">
    <input id="logSearch" placeholder="Filter by staff name..." oninput="renderLog()">
    <div class="meta" style="margin-bottom:8px;">Most recent first · first-admit time per guest</div>
    <div id="logList" class="list"></div>
  </div>

  <div id="pane-add" style="display:none;">
    <h1>Add guest</h1>
    <label>Name</label>
    <input id="addName" placeholder="e.g. Hassan Family">
    <label>Party size</label>
    <input id="addParty" type="number" min="1" value="1" inputmode="numeric">
    <label>Table (optional)</label>
    <input id="addTable" placeholder="e.g. 5 or Head">
    <button onclick="submitAdd()">Create guest + QR</button>
    <div id="addResult"></div>
  </div>

  <button class="secondary" style="margin-top:14px;" onclick="logout()">Sign out</button>
</div>

<div id="modal" class="modal-bg" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let api = '', pin = '', scannerName = '', role = 'staff';
let lastScan = 0;
let lastPayload = '';
let qrScanner = null;
let audioCtx = null;
let awaitingConfirm = false;  // pause scan handling while family card is open
let currentTab = 'scan';
let allGuests = [];
let currentFilter = 'all';

function beep(frequency, duration, type = 'sine') {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = frequency;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function feedback(kind) {
  if (kind === 'ok') {
    beep(880, 0.15);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  } else if (kind === 'duplicate') {
    beep(440, 0.2);
    setTimeout(() => beep(440, 0.2), 220);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } else if (kind === 'confirm') {
    beep(660, 0.12);
    if (navigator.vibrate) navigator.vibrate([60]);
  } else {
    beep(200, 0.4, 'sawtooth');
    if (navigator.vibrate) navigator.vibrate([300]);
  }
}

async function enter() {
  api = document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
  pin = document.getElementById('pin').value.trim();
  scannerName = document.getElementById('name').value.trim() || 'door';

  if (!api || !pin) {
    alert('Fill in API URL and PIN.');
    return;
  }

  // Verify PIN and detect role.
  try {
    const res = await fetch(`${api}/whoami`, { headers: { 'X-Staff-Pin': pin }});
    if (!res.ok) {
      alert('PIN rejected.');
      return;
    }
    const data = await res.json();
    role = data.role || 'staff';
  } catch (e) {
    alert('Could not reach server: ' + e.message);
    return;
  }

  localStorage.setItem('api', api);
  localStorage.setItem('pin', pin);
  localStorage.setItem('name', scannerName);

  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if (role === 'admin') {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  }

  refreshStats();
  startScanner();
}

function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;

  // Pause/resume the camera so it isn't running unseen.
  if (tab === 'scan') {
    startScanner();
  } else if (qrScanner) {
    qrScanner.stop().catch(() => {});
    qrScanner = null;
  }

  ['scan', 'guests', 'add', 'log'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', tab === t);
    document.getElementById('pane-' + t).style.display = tab === t ? '' : 'none';
  });

  if (tab === 'guests') loadGuests();
  if (tab === 'log') loadLog();
}

let allLogs = [];

async function loadLog() {
  try {
    const res = await fetch(`${api}/log?limit=200`, { headers: { 'X-Staff-Pin': pin }});
    if (!res.ok) {
      document.getElementById('logList').innerHTML = `<div class="empty">Could not load (${res.status})</div>`;
      return;
    }
    allLogs = await res.json();
    renderLog();
  } catch (e) {
    document.getElementById('logList').innerHTML = `<div class="empty">Network error</div>`;
  }
}

function renderLog() {
  const q = (document.getElementById('logSearch').value || '').toLowerCase().trim();
  const list = document.getElementById('logList');

  const filtered = allLogs.filter(r => !q || (r.scanned_by || '').toLowerCase().includes(q));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">No scans yet</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => {
    const t = new Date(r.scanned_at);
    const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const date = t.toLocaleDateString([], { month: 'short', day: 'numeric' });
    const tableStr = r.table ? ` · table ${escapeHtml(r.table)}` : '';
    const partyStr = r.party_size > 1 ? ` · ${r.admitted_count}/${r.party_size}` : '';
    return `
      <div class="row" style="cursor:default;">
        <div class="left">
          <div class="name-row">${escapeHtml(r.name)}${partyStr}</div>
          <div class="sub">${date} ${time}${tableStr} · by ${escapeHtml(r.scanned_by || 'unknown')}</div>
        </div>
      </div>`;
  }).join('');
}

function logout() {
  if (qrScanner) qrScanner.stop().catch(() => {});
  localStorage.clear();
  location.reload();
}

async function loadGuests() {
  try {
    const res = await fetch(`${api}/guests`, { headers: { 'X-Staff-Pin': pin }});
    if (!res.ok) {
      document.getElementById('guestList').innerHTML = `<div class="empty">Could not load (${res.status})</div>`;
      return;
    }
    allGuests = await res.json();
    renderGuests();
  } catch (e) {
    document.getElementById('guestList').innerHTML = `<div class="empty">Network error</div>`;
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('#filterChips button');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('#filterChips button').forEach(b => b.classList.toggle('active', b === btn));
  renderGuests();
});

function renderGuests() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const list = document.getElementById('guestList');

  const filtered = allGuests
    .filter(g => currentFilter === 'all' || g.status === currentFilter)
    .filter(g => !q || g.name.toLowerCase().includes(q) || (g.table || '').toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">No guests match</div>`;
    return;
  }

  list.innerHTML = filtered.map(g => {
    const sub = `${g.admitted_count}/${g.party_size} in${g.table ? ` · table ${escapeHtml(g.table)}` : ''}`;
    return `
      <div class="row" data-id="${escapeHtml(g.id)}">
        <div class="left">
          <div class="name-row">${escapeHtml(g.name)}</div>
          <div class="sub">${sub}</div>
        </div>
        <div class="badge ${g.status}">${g.status === 'none' ? 'Pending' : g.status === 'partial' ? 'Partial' : 'Done'}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.row').forEach(row => {
    row.onclick = () => openGuestModal(row.dataset.id);
  });
}

function openGuestModal(id) {
  const g = allGuests.find(x => x.id === id);
  if (!g) return;
  document.getElementById('modalTitle').textContent = g.name;
  const remaining = Math.max(g.party_size - g.admitted_count, 0);
  document.getElementById('modalBody').innerHTML = `
    <div class="meta">${g.admitted_count} of ${g.party_size} admitted${remaining ? ` · ${remaining} remaining` : ''}</div>

    ${remaining > 0 ? `
      <label>Quick admit</label>
      <div class="stepper">
        <button id="mDec" ${1 <= 1 ? 'disabled' : ''}>−</button>
        <div class="count" id="mCount">1</div>
        <button id="mInc" ${remaining <= 1 ? 'disabled' : ''}>+</button>
      </div>
      <button class="admit-btn" id="mAdmit">Admit now</button>
    ` : ''}

    <label>Name</label>
    <input id="eName" value="${escapeHtml(g.name)}">
    <label>Party size</label>
    <input id="eParty" type="number" min="1" value="${g.party_size}" inputmode="numeric">
    <label>Table</label>
    <input id="eTable" value="${escapeHtml(g.table || '')}">
    <label>Admitted count (override)</label>
    <input id="eAdmitted" type="number" min="0" value="${g.admitted_count}" inputmode="numeric">

    <div class="row-actions">
      <button onclick="saveGuest('${g.id}')">Save changes</button>
      <button class="secondary" onclick="showQr('${g.id}')">Show QR</button>
    </div>
    <div class="row-actions">
      <button class="danger" onclick="deleteGuest('${g.id}', '${escapeHtml(g.name).replace(/'/g,"\\'")}')">Delete guest</button>
      <button class="secondary" onclick="closeModal()">Close</button>
    </div>
    <div id="modalQr"></div>
  `;

  if (remaining > 0) {
    let c = 1;
    const cEl = document.getElementById('mCount');
    const dec = document.getElementById('mDec');
    const inc = document.getElementById('mInc');
    const upd = () => {
      cEl.textContent = c;
      dec.disabled = c <= 1;
      inc.disabled = c >= remaining;
    };
    dec.onclick = () => { if (c > 1) { c--; upd(); } };
    inc.onclick = () => { if (c < remaining) { c++; upd(); } };
    document.getElementById('mAdmit').onclick = () => manualAdmit(g.id, c);
  }

  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

async function saveGuest(id) {
  const body = {
    name: document.getElementById('eName').value,
    party_size: parseInt(document.getElementById('eParty').value, 10),
    table: document.getElementById('eTable').value,
    admitted_count: parseInt(document.getElementById('eAdmitted').value, 10),
  };
  try {
    const res = await fetch(`${api}/guests/${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Save failed: ' + (err.detail || res.status));
      return;
    }
    closeModal();
    await loadGuests();
    refreshStats();
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

async function manualAdmit(id, count) {
  try {
    const res = await fetch(`${api}/guests/${encodeURIComponent(id)}/admit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
      body: JSON.stringify({ count, scanner_name: scannerName }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Admit failed: ' + (err.detail || res.status));
      return;
    }
    feedback('ok');
    closeModal();
    await loadGuests();
    refreshStats();
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

async function deleteGuest(id, name) {
  if (!confirm(`Delete ${name}? Their QR will stop working.`)) return;
  try {
    const res = await fetch(`${api}/guests/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'X-Staff-Pin': pin },
    });
    if (!res.ok) {
      alert('Delete failed: ' + res.status);
      return;
    }
    closeModal();
    await loadGuests();
    refreshStats();
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

async function showQr(id) {
  const container = document.getElementById('modalQr');
  container.innerHTML = `<div class="meta" style="text-align:center;">Loading QR...</div>`;
  try {
    const res = await fetch(`${api}/guests/${encodeURIComponent(id)}/qr`, {
      headers: { 'X-Staff-Pin': pin },
    });
    if (!res.ok) {
      container.innerHTML = `<div class="meta" style="text-align:center;">QR failed (${res.status})</div>`;
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    container.innerHTML = `
      <img class="qr-img" src="${url}" alt="QR">
      <div class="row-actions">
        <button onclick="shareQr('${id}', this)">Share</button>
        <a href="${url}" download="${id}.png" style="flex:1;">
          <button class="secondary" style="width:100%;">Download</button>
        </a>
      </div>`;
  } catch (e) {
    container.innerHTML = `<div class="meta">Network error</div>`;
  }
}

async function shareQr(id, btn) {
  try {
    const res = await fetch(`${api}/guests/${encodeURIComponent(id)}/qr`, {
      headers: { 'X-Staff-Pin': pin },
    });
    const blob = await res.blob();
    const file = new File([blob], `${id}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Your party QR' });
    } else {
      alert('Sharing not supported on this device — use Download instead.');
    }
  } catch (e) {
    if (e.name !== 'AbortError') alert('Share failed: ' + e.message);
  }
}

async function submitAdd() {
  const name = document.getElementById('addName').value.trim();
  const party = parseInt(document.getElementById('addParty').value, 10) || 1;
  const table = document.getElementById('addTable').value.trim();
  if (!name) { alert('Name required.'); return; }

  try {
    const res = await fetch(`${api}/guests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
      body: JSON.stringify({ name, party_size: party, table }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Failed: ' + (err.detail || res.status));
      return;
    }
    const data = await res.json();
    const id = data.id;
    document.getElementById('addName').value = '';
    document.getElementById('addParty').value = '1';
    document.getElementById('addTable').value = '';
    refreshStats();

    const out = document.getElementById('addResult');
    out.innerHTML = `
      <div class="result ok" style="margin-top:18px;">
        <div class="icon">✓</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="meta">Party of ${party}${table ? ` · table ${escapeHtml(table)}` : ''}</div>
        <div id="newQr"></div>
      </div>`;

    const qrRes = await fetch(`${api}/guests/${encodeURIComponent(id)}/qr`, {
      headers: { 'X-Staff-Pin': pin },
    });
    const blob = await qrRes.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById('newQr').innerHTML = `
      <img class="qr-img" src="${url}" alt="QR">
      <div class="row-actions">
        <button onclick="shareQr('${id}', this)">Share</button>
        <a href="${url}" download="${escapeHtml(name).replace(/[^a-z0-9]/gi,'_')}_${id}.png" style="flex:1;">
          <button class="secondary" style="width:100%;">Download</button>
        </a>
      </div>`;
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

function startScanner() {
  qrScanner = new Html5Qrcode("reader");
  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScan,
    () => {}
  ).catch(err => {
    alert('Camera error: ' + err);
  });
}

async function callVerify(payload, admitCount /* number | null */) {
  const body = { payload, scanner_name: scannerName };
  if (admitCount !== null) body.admit_count = admitCount;
  const res = await fetch(`${api}/verify`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
    body: JSON.stringify(body),
  });
  if (res.status === 401) {
    return { status: 'invalid', reason: 'Staff PIN rejected' };
  }
  return res.json();
}

async function onScan(decodedText) {
  if (awaitingConfirm) return;  // user is mid-decision on a family
  const now = Date.now();
  if (decodedText === lastPayload && now - lastScan < 3000) return;
  if (now - lastScan < 1000) return;
  lastScan = now;
  lastPayload = decodedText;

  try {
    const data = await callVerify(decodedText, null);
    if (data.status === 'confirm') {
      showConfirm(decodedText, data);
    } else {
      showResult(data);
      refreshStats();
    }
  } catch (e) {
    showResult({ status: 'invalid', reason: 'Network error: ' + e.message });
  }
}

function showConfirm(payload, data) {
  awaitingConfirm = true;
  feedback('confirm');
  const remaining = data.remaining;
  const already = data.admitted_count;
  const total = data.party_size;
  let count = remaining;  // default to admitting everyone left

  const el = document.getElementById('result');
  const render = () => {
    el.innerHTML = `
      <div class="result confirm">
        <div class="icon">👥</div>
        <div class="name">${escapeHtml(data.name)}</div>
        ${data.table ? `<div class="table">Table ${escapeHtml(data.table)}</div>` : ''}
        <div class="meta">Party of ${total}${already ? ` · ${already} already in` : ''}</div>
        <div class="stepper">
          <button id="dec" ${count <= 1 ? 'disabled' : ''}>−</button>
          <div class="count">${count}</div>
          <button id="inc" ${count >= remaining ? 'disabled' : ''}>+</button>
        </div>
        <div class="meta">Admitting ${count} of ${remaining} remaining</div>
        <div class="actions">
          <button class="secondary" id="cancel">Cancel</button>
          <button class="admit-btn" id="admit">Admit ${count}</button>
        </div>
      </div>`;
    document.getElementById('dec').onclick = () => { if (count > 1) { count--; render(); } };
    document.getElementById('inc').onclick = () => { if (count < remaining) { count++; render(); } };
    document.getElementById('cancel').onclick = () => {
      awaitingConfirm = false;
      el.innerHTML = '';
      lastPayload = '';  // allow rescanning the same QR
    };
    document.getElementById('admit').onclick = async () => {
      awaitingConfirm = false;
      try {
        const result = await callVerify(payload, count);
        showResult(result);
        refreshStats();
      } catch (e) {
        showResult({ status: 'invalid', reason: 'Network error: ' + e.message });
      }
    };
  };
  render();
}

function showResult(data) {
  const el = document.getElementById('result');
  let html = '';

  if (data.status === 'ok') {
    const admitted = data.admitted_now || 1;
    const headline = admitted > 1 ? `Welcome, party of ${admitted}` : 'Welcome';
    html = `
      <div class="result ok">
        <div class="icon">✓</div>
        <div>${headline}</div>
        <div class="name">${escapeHtml(data.name)}</div>
        ${data.table ? `<div class="table">Table ${escapeHtml(data.table)}</div>` : ''}
        ${data.party_size > 1 && data.remaining > 0
          ? `<div class="meta">${data.remaining} more from this invite still to arrive</div>` : ''}
      </div>`;
    feedback('ok');
  } else if (data.status === 'duplicate') {
    const t = data.scanned_at ? new Date(data.scanned_at).toLocaleTimeString() : '';
    html = `
      <div class="result duplicate">
        <div class="icon">⚠</div>
        <div>${data.admitted_count} of ${data.party_size} already admitted</div>
        <div class="name">${escapeHtml(data.name)}</div>
        ${data.table ? `<div class="table">Table ${escapeHtml(data.table)}</div>` : ''}
        ${t ? `<div class="reason">first scanned at ${t} by ${escapeHtml(data.scanned_by || 'unknown')}</div>` : ''}
      </div>`;
    feedback('duplicate');
  } else {
    html = `
      <div class="result invalid">
        <div class="icon">✗</div>
        <div>Rejected</div>
        <div class="reason">${escapeHtml(data.reason || 'Unknown')}</div>
      </div>`;
    feedback('invalid');
  }

  el.innerHTML = html;
  setTimeout(() => {
    if (el.innerHTML === html) el.innerHTML = '';
  }, 6000);
}

async function refreshStats() {
  try {
    const res = await fetch(`${api}/stats`, { headers: { 'X-Staff-Pin': pin }});
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('stats').textContent =
      `${data.scanned} / ${data.total} arrived  ·  ${data.remaining} remaining`;
  } catch {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

window.addEventListener('load', () => {
  const savedApi = localStorage.getItem('api');
  const savedPin = localStorage.getItem('pin');
  // Default API URL to the page's own origin (works when scanner.html is
  // served by main.py — i.e. one tunnel URL handles both).
  document.getElementById('apiUrl').value = savedApi || window.location.origin;
  if (savedPin) document.getElementById('pin').value = savedPin;
  document.getElementById('name').value = localStorage.getItem('name') || '';
  if (savedApi && savedPin) {
    document.querySelector('#gate button').textContent = 'Resume scanning';
  }
});

setInterval(() => { if (api && pin) refreshStats(); }, 30000);
</script>
